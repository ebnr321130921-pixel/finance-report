<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio A – 楽天4ファンド月次ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#111;color:#fff;margin:20px;}
        h1{font-size:24px;margin-bottom:10px;}
        .chart-container{margin-top:25px;background:#1c1c1c;padding:15px;border-radius:10px;}
        .info-box{padding:10px;margin-bottom:10px;background:#333;border-radius:6px;font-size:14px;}
    </style>
</head>
<body>
    <h1>Portfolio A（楽天4ファンド）</h1>
    <div class="info-box"><b>最終更新:</b> <span id="last_update">---</span></div>
    <div class="chart-container"><h3>① 基準価額の推移（今月）</h3><canvas id="navChart"></canvas></div>
    <div class="chart-container"><h3>② 上昇率の推移（%）</h3><canvas id="rateChart"></canvas></div>
    <div class="chart-container"><h3>③ 月初からの差額（円）</h3><canvas id="diffChart"></canvas></div>
    <script src="./portfolio_A.js"></script>
</body>
</html>
