
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Finance Dashboard</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="manifest" href="manifest.json">

<style>

:root {
    --bg-1: #07111f;
    --bg-2: #0d1a2b;
    --bg-3: #14243b;
    --card: linear-gradient(180deg, rgba(12, 22, 38, 0.90) 0%, rgba(10, 18, 32, 0.82) 100%);
    --card-border: rgba(255, 255, 255, 0.08);
    --panel-bg: rgba(255, 255, 255, 0.035);
    --panel-border: rgba(255, 255, 255, 0.06);
    --text-main: #eef4ff;
    --text-sub: #9fb0ca;
    --accent: #6ea8fe;
    --accent-2: #8ef0d2;
    --shadow: 0 18px 46px rgba(0, 0, 0, 0.34);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 28px;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(63, 131, 248, 0.22), transparent 24%),
        radial-gradient(circle at 85% 10%, rgba(45, 212, 191, 0.10), transparent 18%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
    color: var(--text-main);
}

.card {
    background: var(--card);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 26px;
    padding: 26px 26px 24px 26px;
    margin-bottom: 24px;
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
}

h1 {
    font-size: 32px;
    line-height: 1.1;
    margin: 0 0 24px 0;
    letter-spacing: 0.01em;
    font-weight: 800;
    color: #f8fbff;
}

h2 {
    font-size: 17px;
    line-height: 1.35;
    margin: 0 0 16px 0;
    color: #f8fbff;
    font-weight: 750;
}

.section {
    display: flex;
    gap: 18px;
    align-items: stretch;
    flex-wrap: wrap;
}

.imghalf {
    width: calc(50% - 9px);
    min-width: 320px;
    border-radius: 18px;
    overflow: hidden;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    padding: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
}

img {
    display: block;
    width: 100%;
    height: auto;
}

@media (max-width: 900px) {
    body {
        padding: 18px;
    }

    .card {
        padding: 18px;
        border-radius: 20px;
    }

    .imghalf {
        width: 100%;
        min-width: 0;
    }
}

.indexwrap { max-width:1080px; margin:0 auto; }
.indexcard {
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.78) 0%, rgba(17, 24, 39, 0.70) 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 26px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.32);
    border: 1px solid rgba(255,255,255,0.10);
    margin-bottom: 34px;
}
.index_title {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
    color: #f8fafc;
}
.timestamp {
    font-size: 14px;
    color: #94a3b8;
    margin: 0 0 24px 0;
}
.section_header {
    font-size: 13px;
    font-weight: 700;
    color: #cbd5e1;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    margin: 26px 0 12px 2px;
}
.index_list {
    border-radius: 18px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
}
.index_row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    font-size:16px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    transition: background 0.18s ease, transform 0.18s ease;
}
.index_row:hover {
    background: rgba(255,255,255,0.05);
}
.index_row:last-child { border-bottom:none; }
.index_row_left { display:flex; align-items:center; gap:12px; }
.index_row_icon {
    font-size:18px;
    width:34px;
    height:34px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background: rgba(255,255,255,0.07);
    text-align:center;
}
.index_row_arrow { font-size:18px; color:#94a3b8; }
.index_row a { text-decoration:none; color:#e5edf9; font-weight:600; }

.index_row_disabled { opacity:0.45; pointer-events:none; }

.market_val_up { color:#86efac; font-weight:700; }
.market_val_down { color:#fca5a5; font-weight:700; }
.market_val_flat { color:#cbd5e1; font-weight:700; }
</style>
</head>

<body>
<div class="indexwrap">

<div class="indexcard">
    <div class="index_title">Finance Dashboard</div>
    <div class="timestamp">Last Updated: 2026-05-04 20:50 JST</div>

    <div class="section_header">US Market Today</div>
    <div class="index_list">

        <div class="index_row">
            <div class="index_row_left"><span class="index_row_icon">🇺🇸</span><span>S&P 500</span></div>
            <span class="market_val_up">
                7,230.12 (+0.29%)
            </span>
        </div>

        <div class="index_row">
            <div class="index_row_left"><span class="index_row_icon">💹</span><span>NASDAQ 100</span></div>
            <span class="market_val_up">
                27,710.36 (+0.94%)
            </span>
        </div>

        <div class="index_row">
            <div class="index_row_left"><span class="index_row_icon">💱</span><span>USD / JPY</span></div>
            <span class="market_val_up">
                157.16
            </span>
        </div>

    </div>

    <div class="section_header">Reports</div>
    <div class="index_list">

        <div class="index_row">
            <div class="index_row_left"><span class="index_row_icon">📈</span>
                <a href="analysis_report.html">Analysis Report</a>
            </div>
            <span class="index_row_arrow">›</span>
        </div>

        <div class="index_row index_row_disabled">
            <div class="index_row_left"><span class="index_row_icon">📊</span>
                <span>US Market Details (coming)</span>
            </div>
            <span class="index_row_arrow">›</span>
        </div>

        <div class="index_row index_row_disabled">
            <div class="index_row_left"><span class="index_row_icon">💰</span>
                <span>Rakuten Data (coming)</span>
            </div>
            <span class="index_row_arrow">›</span>
        </div>

    </div>

</div>

</div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
