
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Finance Dashboard</title>

<link rel="manifest" href="manifest.json">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<style>

/* Apple純正 UIスタイル */
body {
    margin: 0;
    padding: 28px;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial;
    background: linear-gradient(
        to bottom,
        #d7d7d7 0%,
        #cfcfcf 40%,
        #c5c5c5 55%,
        #dcdcdc 100%
    ),
    repeating-linear-gradient(
        to right,
        rgba(255,255,255,0.20) 0px,
        rgba(255,255,255,0.20) 2px,
        rgba(0,0,0,0.10) 4px,
        rgba(0,0,0,0.10) 6px
    );
    background-blend-mode: overlay;
    background-size: 100% 100%, 6px 100%;
    color: #222;
}

.indexwrap {
    max-width: 900px;
    margin: 0 auto;
}

.indexcard {
    background: rgba(255,255,255,0.32);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 24px 26px;
    box-shadow:
        0 2px 6px rgba(0,0,0,0.12),
        0 10px 25px rgba(0,0,0,0.10);
    border: 1px solid rgba(255,255,255,0.45);
    margin-bottom: 34px;
}

.index_title {
    font-size: 22px;
    font-weight: 700;
    color: #222;
    margin-bottom: 22px;
}

.timestamp {
    font-size: 15px;
    font-weight: 600;
    color: #555;
    margin: 0 0 22px 0;
}

.section_header {
    font-size: 14px;
    font-weight: 600;
    color: #888;
    margin: 22px 0 10px 2px;
}

.index_list {
    border-radius: 14px;
    overflow: hidden;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.5);
    backdrop-filter: blur(12px);
}

.index_row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    font-size: 16px;
    color: #222;
    border-bottom: 1px solid rgba(255,255,255,0.55);
}

.index_row:last-child {
    border-bottom: none;
}

.index_row_left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.index_row_icon {
    font-size: 20px;
    width: 22px;
    text-align: center;
}

.index_row_arrow {
    font-size: 18px;
    color: #888;
}

.index_row_disabled {
    opacity: 0.45;
    pointer-events: none;
}

.index_row a {
    text-decoration: none;
    color: #222;
}

</style>
</head>

<body>
<div class="indexwrap">

<div class="indexcard">
    <div class="index_title">Finance Dashboard</div>

    <div class="timestamp">Last Updated: 2025-11-30 09:19 JST</div>

    <div class="section_header">REPORTS</div>
    <div class="index_list">

        <div class="index_row">
            <div class="index_row_left">
                <span class="index_row_icon">📈</span>
                <a href="analysis_report.html">Analysis Report</a>
            </div>
            <span class="index_row_arrow">›</span>
        </div>

        <div class="index_row index_row_disabled">
            <div class="index_row_left">
                <span class="index_row_icon">📊</span>
                <span>US Market (coming soon)</span>
            </div>
            <span class="index_row_arrow">›</span>
        </div>

        <div class="index_row index_row_disabled">
            <div class="index_row_left">
                <span class="index_row_icon">💰</span>
                <span>Rakuten Data (coming soon)</span>
            </div>
            <span class="index_row_arrow">›</span>
        </div>

    </div>
</div>

</div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
