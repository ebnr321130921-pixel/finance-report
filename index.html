
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Finance Dashboard</title>
<style>

body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue;

    /* 本物のアルミの光沢と陰影 */
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.90) 0%,
            rgba(255,255,255,0.70) 6%,
            rgba(190,190,190,0.35) 30%,
            rgba(165,165,165,0.30) 55%,
            rgba(200,200,200,0.45) 80%,
            rgba(255,255,255,0.80) 100%
        ),

        /* 金属粒子ノイズの光散乱 */
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.38), rgba(0,0,0,0) 70%),
        radial-gradient(circle at 70% 70%, rgba(255,255,255,0.28), rgba(0,0,0,0) 70%),

        /* 下側からの金属反射 */
        linear-gradient(
            180deg,
            rgba(255,255,255,0.00) 40%,
            rgba(255,255,255,0.20) 90%,
            rgba(255,255,255,0.40) 100%
        ),

        /* ノイズ（超薄） */
        url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIW2NgYGAAAAAEAAGjCh0YAAAAAElFTkSuQmCC');

    background-size:
        100% 100%,
        800px 800px,
        800px 800px,
        100% 100%,
        300px 300px;

    color: #222;
}

.card {
    background: 
        linear-gradient(
            180deg,
            rgba(255,255,255,0.65) 0%,
            rgba(240,240,240,0.40) 40%,
            rgba(220,220,220,0.30) 70%,
            rgba(255,255,255,0.55) 100%
        );

    backdrop-filter: blur(10px);
    border-radius: 14px;

    padding: 18px 20px;
    margin-bottom: 28px;

    border: 1px solid rgba(255,255,255,0.58);
    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.85),
        inset 0 -1px 2px rgba(0,0,0,0.10),
        0 6px 16px rgba(0,0,0,0.26);
}

h1 {
    font-size: 22px;
    margin-bottom: 18px;
    text-shadow: 0px 1px 1px rgba(255,255,255,0.9);
}

h2 {
    font-size: 14px;
    margin-bottom: 10px;
    text-shadow: 0px 1px 0 rgba(255,255,255,0.8);
}

.section {
    display: flex;
    gap: 18px;
    justify-content: space-between;
}

.imghalf {
    width: 48%;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}

img {
    width: 100%;
}



.indexwrap {
    max-width: 880px;
    margin: 0 auto;
}

.indexcard {
    background: rgba(255,255,255,0.25);
    padding: 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.50);
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.index_title {
    font-size: 22px;
    margin-bottom: 18px;
    text-shadow: 0px 1px 0 rgba(255,255,255,0.9);
}

.index_btns a {
    display: block;
    padding: 14px;
    margin: 12px 0;
    text-align: center;
    border-radius: 12px;
    background: linear-gradient(180deg,#ffffff,#dcdcdc);
    border:1px solid rgba(0,0,0,0.25);
    text-decoration:none;
    color:#222;
}
</style>
</head>
<body>
<div class="indexwrap">
<div class="indexcard">
    <div class="index_title">Finance Dashboard</div>
    <div class="index_btns">
        <a href="analysis_report.html">📈 Analysis Report</a>
        <a href="run_update.command">🔄 更新（CSV & HTML再生成）</a>
    </div>
</div>
</div>
</body>
</html>
