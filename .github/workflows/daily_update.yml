name: Daily Data Update

on:
  schedule:
    # JST 7:00 / 18:00 / 20:00 / 22:00
    # UTC = JST - 9
    - cron: '0 22 * * *'   # JST 7:00
    - cron: '0 9 * * *'    # JST 18:00
    - cron: '0 11 * * *'   # JST 20:00
    - cron: '0 13 * * *'   # JST 22:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r "$(github.workspace)/requirements.txt"

      # ================================
      #  QQQ / SP500
      # ================================
      - name: Run QQQ / SP500 updater
        run: |
          cd 1_QQQ-SP500
          python3 update_all.py

      # ================================
      #  Rakuten
      # ================================
      - name: Run Rakuten updater
        run: |
          cd 2_RAKUTEN
          python3 rakuten_update.py

      # ================================
      #  US Index
      # ================================
      - name: Run US Index updater
        run: |
          cd 3_US_Index
          python3 us_index_daily.py

      # ================================
      #  Commit & Push (完全修正版)
      # ================================
      - name: Commit and push changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 変更を全てステージング
          git add -A

          # 差分がある場合のみ commit
          git diff --cached --quiet || git commit -m "Auto update"

          # pull は commit の後！ ← これが重要
          git pull --rebase

          # 最後に push
          git push
