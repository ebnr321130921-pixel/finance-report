name: Daily Data Update

on:
  schedule:
    # JST 0:00 / 6:00 / 9:00 / 12:00 / 17:00 / 19:00 / 21:00 / 23:00
    # ※ GitHub Actions は UTC 基準
    - cron: '0 15 * * *'  # JST 00:00
    - cron: '0 21 * * *'  # JST 06:00
    - cron: '0 0  * * *'  # JST 09:00
    - cron: '0 3  * * *'  # JST 12:00
    - cron: '0 8  * * *'  # JST 17:00
    - cron: '0 10 * * *'  # JST 19:00
    - cron: '0 12 * * *'  # JST 21:00
    - cron: '0 14 * * *'  # JST 23:00

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # QQQ / SP500
      # ------------------------------------------------------------
      - name: Run QQQ / SP500 updater
        run: |
          python3 1_QQQ-SP500/update_all.py

      # ------------------------------------------------------------
      # Rakuten
      # ------------------------------------------------------------
      - name: Run Rakuten updater
        run: |
          python3 2_RAKUTEN/rakuten_update.py

      # ------------------------------------------------------------
      # US Index（★ここが本命）
      # run_all.py が全処理の唯一の入口
      # ------------------------------------------------------------
      - name: Run US Index (ALL)
        run: |
          python3 3_US_Index/run_all.py

      # ------------------------------------------------------------
      # Commit & Push
      # ------------------------------------------------------------
      - name: Commit and push changes (robust, no rollback)
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git add -A
          git commit -m "Auto update" || echo "No changes"

          # 巻き戻りゼロ・競合回避・pull不要
          git push --force-with-lease
