name: Daily Data Update

on:
  schedule:
    # JST 0:00 / 6:00 / 9:00 / 12:00 / 17:00 / 19:00 / 21:00 / 23:00
    - cron: '0 15 * * *'  # JST 00:00
    - cron: '0 21 * * *'  # JST 06:00
    - cron: '0 0 * * *'   # JST 09:00
    - cron: '0 3 * * *'   # JST 12:00
    - cron: '0 8 * * *'   # JST 17:00
    - cron: '0 10 * * *'  # JST 19:00
    - cron: '0 12 * * *'  # JST 21:00
    - cron: '0 14 * * *'  # JST 23:00

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run QQQ / SP500 updater
        run: |
          cd 1_QQQ-SP500
          python3 update_all.py

      - name: Run Rakuten updater
        run: |
          cd 2_RAKUTEN
          python3 rakuten_update.py

      - name: Run US Index updater
        run: |
          cd 3_US_Index
          python3 us_index_daily.py

      - name: Commit and push changes (robust, no rollback)
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git add -A
          git commit -m "Auto update" || echo "No changes"

          # 巻き戻りゼロ・pull不要・競合なしの最強仕様
          git push --force-with-lease
