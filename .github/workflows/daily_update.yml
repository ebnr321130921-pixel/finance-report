name: Daily Data Update

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run QQQ / SP500 updater
        run: |
          cd 1_QQQ-SP500
          python3 update_all.py

      - name: Run Rakuten updater
        run: |
          cd 2_RAKUTEN
          python3 rakuten_update.py

      - name: Run US Index updater
        run: |
          cd 3_US_Index
          python3 us_index_daily.py

      - name: Commit and push changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add -A
          git commit -m "Daily auto update" || echo "No changes to commit"
          git push
