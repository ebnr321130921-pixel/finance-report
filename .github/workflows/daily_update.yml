name: Daily Data Update

on:
  schedule:
    # GitHub Actions は UTC 基準
    # JST 09:00 / 12:00 / 15:00 / 18:00 / 21:00 / 23:00
    - cron: '0 0  * * *'  # JST 09:00
    - cron: '0 3  * * *'  # JST 12:00
    - cron: '0 6  * * *'  # JST 15:00
    - cron: '0 9  * * *'  # JST 18:00
    - cron: '0 12 * * *'  # JST 21:00
    - cron: '0 14 * * *'  # JST 23:00

  workflow_dispatch:

concurrency:
  group: daily-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run QQQ / SP500 updater
        run: |
          python 1_QQQ-SP500/update_all.py

      - name: Run Rakuten updater
        run: |
          python 2_RAKUTEN/rakuten_update.py

      - name: Run US Index updater
        run: |
          python 3_US_Index/run_all.py

      - name: Build index.html
        run: |
          python build_index.py

      - name: Commit and push changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto update"

          git pull --rebase origin main
          git push origin main
